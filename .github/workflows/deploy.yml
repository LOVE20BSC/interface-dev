name: deploy-pages

# Deploy exactly one build variant per repository to GitHub Pages (ADR-0002 §5).
#
# Environment selection is by repository-name keyword, never by branch:
#   name contains "dev"   -> dev   (base /interface-dev/)
#   else contains "test"  -> test  (base /interface-test/)
#   else                  -> prod  (base /)
# The lowercased name after the final "/" is tested in that order
# (dev -> test -> prod), so every repository always resolves to one variant.
# Accepted consequence: a fork whose name contains "dev" (for example
# someone/interface-dev) builds the dev variant. The owner accepted this in
# exchange for interface1 / interface2 / interface3 and other
# bandwidth-splitting repositories (no dev/test keyword) falling through to
# prod automatically.
# `vars.VITE_ENV` (dev|test|prod) explicitly overrides the keyword and
# `vars.VITE_BASE` overrides the base path. Only the `prepare` job branches;
# the build receives plain VITE_ENV / VITE_BASE / VITE_SITE_ORIGIN values.
#
# Placeholders: none. All three repository names and the LOVE20BSC owner are
# known today, so the base paths and the default site origin are real values,
# not __GH_OWNER__ / __GH_REPO__ placeholders. When prod moves to a custom
# domain, set the repository variable VITE_SITE_ORIGIN (e.g.
# https://love20.example) instead of editing this file.
#
# release-guard (comment only, no enforcement): production deploys of
# LOVE20BSC/interface are supposed to arrive only through
# `pnpm release-to LOVE20BSC/interface`, i.e. a fast-forward push whose commit
# was already released to the earlier repositories (ADR-0002 §4). Actions
# cannot tell that push apart from a direct push or a web-UI merge, so nothing
# in this workflow enforces the rule. The invariant relies on branch protection
# in every participating repository: no direct pushes to `main`, no
# pull-request merges, no force-pushes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build variant
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      base_path: ${{ steps.resolve.outputs.base_path }}
      site_origin: ${{ steps.resolve.outputs.site_origin }}
    steps:
      - name: Resolve environment and base path
        id: resolve
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VITE_ENV_OVERRIDE: ${{ vars.VITE_ENV }}
          VITE_BASE_OVERRIDE: ${{ vars.VITE_BASE }}
          VITE_SITE_ORIGIN_OVERRIDE: ${{ vars.VITE_SITE_ORIGIN }}
        run: |
          set -euo pipefail

          # ADR-0002 §5: match keywords in the repository name, never the full
          # owner/repo identity and never a branch. Lowercasing the segment
          # after the final "/" makes the rule deterministic for forks and for
          # interface1 / interface2 / interface3. Order matters: dev wins over
          # test, test wins over prod.
          repo_name="$(printf '%s' "${REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
          if [[ -n "${VITE_ENV_OVERRIDE}" ]]; then
            environment="$(printf '%s' "${VITE_ENV_OVERRIDE}" | tr '[:upper:]' '[:lower:]')"
          elif [[ "${repo_name}" == *dev* ]]; then
            environment="dev"
          elif [[ "${repo_name}" == *test* ]]; then
            environment="test"
          else
            environment="prod"
          fi

          # Base path follows the resolved variant, not the repository's owner.
          # vars.VITE_BASE still wins; normalize it to /prefix/ with one leading
          # and one trailing slash.
          case "${environment}" in
            dev) default_base="/interface-dev/" ;;
            test) default_base="/interface-test/" ;;
            prod) default_base="/" ;;
            *)
              echo "::error::vars.VITE_ENV must be dev, test or prod (got '${environment}')."
              exit 1
              ;;
          esac
          base_path="${VITE_BASE_OVERRIDE:-${default_base}}"
          [[ "${base_path}" == /* ]] || base_path="/${base_path}"
          [[ "${base_path}" == */ ]] || base_path="${base_path}/"

          if [[ -n "${VITE_SITE_ORIGIN_OVERRIDE}" ]]; then
            site_origin="${VITE_SITE_ORIGIN_OVERRIDE}"
          else
            # tr instead of ${VAR,,} so the script also runs on bash 3.2 (macOS)
            # while producing the same lowercase Pages host.
            owner_lower="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            site_origin="https://${owner_lower}.github.io"
          fi

          {
            echo "environment=${environment}"
            echo "base_path=${base_path}"
            echo "site_origin=${site_origin}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Build variant"
            echo ""
            echo "| repository | vars.VITE_ENV | environment | base path | site origin |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| \`${REPOSITORY}\` | \`${VITE_ENV_OVERRIDE:-<unset>}\` | \`${environment}\` | \`${base_path}\` | \`${site_origin}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  build:
    name: Build
    needs: [prepare, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No conditionals here: prepare already resolved the variant and base.
      # `pnpm build` runs typecheck, vite build, postbuild and the bundle budget.
      - name: Build
        run: pnpm build
        env:
          VITE_ENV: ${{ needs.prepare.outputs.environment }}
          VITE_BASE: ${{ needs.prepare.outputs.base_path }}
          VITE_SITE_ORIGIN: ${{ needs.prepare.outputs.site_origin }}

      # The ABI drift gate (ADR-0002 §3.4) cannot run here: this checkout has no
      # forge and no sibling contract repos. It belongs in the anvil/contracts
      # job that can `forge build` and regenerate the ABI manifest.

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
