<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf1f7" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="LOVE20协议" />
    <meta
      name="description"
      content="LOVE20协议：身份优先的社区协作网络。连接钱包，找到你的成员身份，参与社区治理与行动。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LOVE20协议" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="LOVE20协议" />
    <meta
      property="og:description"
      content="身份优先的社区协作网络。连接钱包，找到你的成员身份。"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>LOVE20协议</title>
    <script>
      /*
       * Theme bootstrap (ADR-0005). Mirrors src/shared/lib/theme.ts and runs
       * before the first paint: without it the light palette flashes for one
       * frame before React applies the stored dark choice. Keep the key
       * `love20:theme`, the attribute and the theme-color values in sync with
       * theme.ts (guarded by src/shared/lib/theme.test.ts).
       */
      (function () {
        try {
          var storageKey = 'love20:theme';
          var metaColors = { light: '#edf1f7', dark: '#0b0e11' };
          var stored = localStorage.getItem(storageKey);
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', metaColors[theme]);
          var colorScheme = document.querySelector('meta[name="color-scheme"]');
          if (colorScheme) colorScheme.setAttribute('content', theme);
        } catch (error) {
          // Storage can throw (private mode / sandboxed iframe): light still applies.
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; line-height: 1.6">
        LOVE20协议 需要 JavaScript 才能运行。请在浏览器设置中启用 JavaScript 后刷新。
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
